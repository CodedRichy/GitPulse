appId: com.gitpulse.desktop
productName: GitPulse
copyright: Copyright © 2024 Rishi Praseeth Krishnan

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - python-backend/**/*
  - "!python-backend/__pycache__/**/*"
  - "!python-backend/.git/**/*"
  - "!python-backend/*.pyc"

extraResources:
  - from: python-backend
    to: python-backend
    filter:
      - "!**/__pycache__/**/*"
      - "!**/*.pyc"
      - "!**/.git/**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  requestedExecutionLevel: asInvoker
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GitPulse

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icon.icns
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  title: GitPulse Installer
  icon: assets/icon.icns
  background: assets/dmg-background.png
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: assets/icon.png
  category: Development
  artifactName: ${productName}-${version}-${arch}.${ext}

AppImage:
  desktopName: GitPulse
  desktopComment: AI-Powered Git Automation

deb:
  depends:
    - python3
    - python3-pip
  desktop:
    Name: GitPulse
    Comment: AI-Powered Git Automation
    Categories: Development;

publish:
  provider: github
  owner: gitpulse
  repo: gitpulse-desktop
