[workspace]
members = [
    "cli",
    "core",
    "ai",
]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2021"
authors = ["GitPulse Team"]
license = "MIT"
repository = "https://github.com/yourusername/gitpulse"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "5.0"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
reqwest = { version = "0.11", features = ["json"] }
config = "0.14"
