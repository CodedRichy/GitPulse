[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_GITHUB_CLIENT_ID,GITHUB_CLIENT_ID,NEXT_PUBLIC_RECAPTCHA_SITE_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect rules for SPA behavior
[[redirects]]
  from = "/_next/static/*"
  to = "/_next/static/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  condition = "{headers['accept'] !~= 'text/html'}"
